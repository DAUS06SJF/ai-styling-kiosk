spring:
  datasource:
    # 테스트도 MySQL 사용. 개발 DB(styling)와 섞이지 않도록 styling_test 스키마를 따로 쓴다.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:styling_test}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      # 테스트 시작 시 스키마를 새로 만들고 끝나면 지운다.
      ddl-auto: create-drop
    open-in-view: false

logging:
  level:
    org.hibernate.SQL: warn
