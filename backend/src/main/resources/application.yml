spring:
  application:
    name: ai-styling-kiosk

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:styling}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      # 개발 단계에서는 update, 스키마가 굳으면 validate 로 변경
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    # data.sql 을 테이블 생성 이후에 실행시키기 위해 필요
    defer-datasource-initialization: true

  sql:
    init:
      # data.sql 의 MCM 상품 시드 데이터를 매 기동 시 적재 (INSERT IGNORE 라 중복 없음)
      mode: always
      # 지정하지 않으면 Windows 기본 인코딩(CP949)으로 읽어 한글이 깨진다
      encoding: UTF-8

  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

# 키오스크 / 관리자 / 모바일 3개 프론트가 붙는 주소
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}

logging:
  level:
    org.hibernate.SQL: debug
    com.hackathon.styling: debug
